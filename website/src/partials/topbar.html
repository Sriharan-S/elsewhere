<div class="progress" aria-hidden="true"><span class="progress__fill"></span></div>
<header class="topbar" data-topbar>
  <a class="topbar__brand" href="#top" aria-label="{{name}}, back to top">
    <!-- component:logo id="tb-logo" class="topbar__mark" variant="tight" stroke="20" -->
    <span class="topbar__name">{{name}}</span>
  </a>
  <p class="topbar__hud mono" data-hud aria-hidden="true">
    <span><span class="hud__k">LAT</span> <span class="hud__v" data-hud-lat>13.0827</span></span>
    <span class="hud__k">·</span>
    <span><span class="hud__k">LNG</span> <span class="hud__v" data-hud-lng>80.2707</span></span>
    <span class="hud__k">·</span>
    <span class="hud__v" data-hud-extra>ACC 3 M</span>
    <span class="hud__k">·</span>
    <span class="hud__status is-on" data-hud-status>MOCK ON</span>
  </p>
  <div class="topbar__actions">
    <span class="topbar__folio folio" aria-hidden="true"><span class="folio__n" data-folio-index>00</span> / 09</span>
    <a class="btn btn--primary btn--s topbar__dl" href="{{apk}}" data-download aria-label="Download APK"><span>Download</span><span class="topbar__apk">APK</span></a>
  </div>
</header>
