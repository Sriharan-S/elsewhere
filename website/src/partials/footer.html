<footer class="site-footer" id="footer">
  <svg class="site-footer__divider" viewBox="0 0 1200 24" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <polyline points="0,5 150,5 196,15 690,21 980,11 1200,21" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5.4 4.4" vector-effect="non-scaling-stroke"/>
  </svg>
  <div class="site-footer__row">
    <p class="site-footer__meta mono">
      <span>{{name}}</span><span class="site-footer__sep" aria-hidden="true">·</span><span>MIT</span><span class="site-footer__sep site-footer__sep--wide" aria-hidden="true">·</span>
      <span class="site-footer__osm">Map data © <a class="inline" href="https://www.openstreetmap.org/copyright" rel="noopener">OpenStreetMap</a> contributors</span>
    </p>
    <nav class="site-footer__links mono" aria-label="Project links">
      <a href="{{repo}}" rel="noopener">GitHub</a>
      <a href="{{releases}}" rel="noopener">Releases</a>
      <a href="{{repo}}/blob/main/LICENSE" rel="noopener">License</a>
    </nav>
  </div>
  <div class="site-footer__row">
    <p class="site-footer__note">Made for testing location apps. Respect app terms and local law.</p>
    <p class="site-footer__note">Made by {{author}} · {{domain}}</p>
  </div>
</footer>
